name: Weekly Instagram Scraper

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Refresh Instagram session from Firefox
        shell: bash
        run: python scripts/refresh_session.py

      - name: Setup GCP credentials
        shell: bash
        run: |
          echo '${{ secrets.GCP_SA_KEY_JSON }}' > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/gcp-key.json" >> $GITHUB_ENV

      - name: Run scraper
        shell: bash
        env:
          INSTAGRAM_USERNAME: "pelobemdapesquisa"
          INSTA_SESSION_FILE: "session-file"
          BQ_PROJECT: "master-research-492307"
          BQ_DATASET: "instagram_research"
          BQ_TABLE: "political_posts"
        run: python insta_scraper.py

      - name: Cleanup secrets
        if: always()
        shell: bash
        run: rm -f session-file gcp-key.json
