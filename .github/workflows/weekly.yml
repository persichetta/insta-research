name: Weekly Instagram Scraper

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Instagram session from Firefox
        run: python scripts/refresh_session.py

      - name: Setup GCP credentials
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          $env:GCP_KEY | Set-Content gcp-key.json -Encoding utf8
          "GOOGLE_APPLICATION_CREDENTIALS=$env:GITHUB_WORKSPACE\gcp-key.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run scraper
        env:
          INSTAGRAM_USERNAME: "pelobemdapesquisa"
          INSTA_SESSION_FILE: "session-file"
          BQ_PROJECT: "master-research-492307"
          BQ_DATASET: "instagram_research"
          BQ_TABLE: "political_posts"
        run: python insta_scraper.py

      - name: Cleanup secrets
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue session-file, gcp-key.json
