name: Weekly Comments Scraper

on:
  schedule:
    # quarta 06:00 UTC (03:00 BRT) - meio da semana, separado do post scraper
    - cron: "0 6 * * 3"
  workflow_dispatch:

jobs:
  scrape-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode Instagram session file
        run: |
          echo "${{ secrets.INSTA_SESSION_BASE64 }}" | base64 -d > session-file

      - name: Setup GCP credentials
        run: |
          echo '${{ secrets.GCP_SA_KEY_JSON }}' > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/gcp-key.json" >> $GITHUB_ENV

      - name: Run comments scraper
        env:
          INSTAGRAM_USERNAME: "pelobemdapesquisa"
          INSTA_SESSION_FILE: "session-file"
          BQ_PROJECT: "master-research-492307"
          BQ_DATASET: "instagram_research"
          MAX_POSTS_PER_RUN: "5"
          DELAY_BETWEEN_POSTS: "10"
        run: python insta_comments_scraper.py

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f session-file gcp-key.json
